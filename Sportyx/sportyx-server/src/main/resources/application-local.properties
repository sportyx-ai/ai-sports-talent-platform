# ============================================================
# LOCAL / OFFLINE PROFILE (H2 Database)
# Run anytime without internet or external cloud database:
# .\mvnw spring-boot:run -Dspring-boot.run.profiles=local
# ============================================================

# File-based H2 database (persists data in ./data/sportyxdb between restarts)
spring.datasource.url=jdbc:h2:file:./data/sportyxdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate configuration for H2
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
