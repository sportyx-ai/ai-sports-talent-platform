spring.application.name=backend

# SERVER
server.port=8080
server.address=0.0.0.0

# =============================================
# DATABASE (Defaults to Local File-Based Persistent H2 Database)
# To use persistent file storage: jdbc:h2:file:./data/sportyxdb
# To use PostgreSQL: jdbc:postgresql://localhost:5432/sportyxdb
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/sportyxdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.h2.console.enabled=true

# HikariCP Connection Pool Settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =============================================
# LOGGING
# =============================================
logging.level.org.hibernate.SQL=INFO
logging.level.com.sportyx=INFO

# =============================================
# FILE UPLOADS & ML INTEGRATION
# =============================================
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.file-size-threshold=10MB
spring.servlet.multipart.location=${java.io.tmpdir}

app.upload.dir=uploads
app.ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

server.tomcat.max-http-post-size=536870912